name: Mobile quality
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet workload install maui-android
      - run: dotnet restore CGM.PatientApp.Tests/CGM.PatientApp.Tests.csproj
      - run: dotnet test CGM.PatientApp.Tests/CGM.PatientApp.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults
      - run: dotnet build Userapp/CGM.PatientApp.csproj -f net10.0-android -c Release --no-restore
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mobile-test-results, path: TestResults }
